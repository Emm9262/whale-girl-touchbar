name: Prepare unsigned release package
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Audit publishable files
        run: python3 scripts/audit-release.py --tree .
      - name: Set up Node.js for isolated bridge tests
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Check credentials locally with pinned Gitleaks
        run: python3 scripts/scan-publish.py
      - name: Build universal2 app
        run: bash build.sh
      - name: Verify app and host fixtures
        run: bash scripts/test.sh
      - name: Package without publishing
        run: bash scripts/package.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: universal2-adhoc-unnotarized
          path: dist/*
          if-no-files-found: error
          retention-days: 7
